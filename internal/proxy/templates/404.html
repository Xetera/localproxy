<!DOCTYPE html>
<html>
<head>
  <title>404 - Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: 6rem;
      font-weight: 700;
      color: #525252;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #a3a3a3;
      margin-bottom: 0.5rem;
    }
    .message {
      font-size: 0.875rem;
      color: #737373;
      margin-bottom: 2rem;
    }
    .domain {
      font-family: ui-monospace, monospace;
      color: #60a5fa;
      background: #1e3a5f;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
    }
    .link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      border-radius: 0.375rem;
      border: 1px solid #404040;
      background: #1a1a1a;
      color: #a3a3a3;
      text-decoration: none;
      transition: all 0.15s;
    }
    .link:hover {
      background: #262626;
      color: #e5e5e5;
      border-color: #525252;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="title">Service Not Found</div>
    <div class="message">No service is registered for <span class="domain">{{.Subdomain}}</span></div>
    <a href="https://proxy.localhost" class="link">Go to Dashboard</a>
  </div>
</body>
</html>
