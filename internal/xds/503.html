<!doctype html>
<html>
  <head>
    <title>503 Service Unavailable</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .container {
        text-align: center;
        max-width: 500px;
      }
      h1 {
        font-size: 4rem;
        color: #ef4444;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #fff;
      }
      p {
        color: #b8b8b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>503</h1>
      <h2>Service Unavailable</h2>
      <p>
        The backend service is not responding. Please check that your
        application is running and try again.
      </p>
    </div>
  </body>
</html>
